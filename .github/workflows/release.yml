# Windows x64 followed by macOS Default universal; original static dependencies.
name: Build

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  PRODUCT_NAME: Compact Encoding Detection
  MACOS_DEPLOYMENT_TARGET: '11.0'
  BASE_DIR: test
  PYTHONDONTWRITEBYTECODE: '1'
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: 'false'

concurrency:
  group: source-publication
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Validate source and publication absence before native work
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/release.py preflight --sha "$GITHUB_SHA"

  build-windows:
    name: Build Windows (x64)
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Check clean selected checkout before native work
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/release.py preflight --sha "$GITHUB_SHA"
      - name: setup MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: clean stale Windows outputs
        shell: pwsh
        run: ./.github/scripts/windows.ps1 -Phase prepare
      - name: build x64
        shell: cmd
        run: |
          msbuild "%PRODUCT_NAME%.sln" /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0 /m
      - name: collect Windows binaries
        shell: pwsh
        run: ./.github/scripts/windows.ps1 -Phase collect
      - name: upload windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: winbin/
          if-no-files-found: error

  build-macos:
    name: Build macOS, package, sign, notarize & release
    needs: [version, build-windows]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Check clean selected checkout before native work
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/release.py preflight --sha "$GITHUB_SHA"
      - name: download windows binaries
        uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: winbuild
      - name: import Developer ID certificate
        env:
          CERT_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: bash .github/scripts/native.sh import-certificate
      - name: store notarytool credentials
        env:
          APPLE_ID: ${{ secrets.NOTARYTOOL_APPLE_ID }}
          TEAM_ID: ${{ secrets.NOTARYTOOL_TEAM_ID }}
          APP_PASSWORD: ${{ secrets.NOTARYTOOL_PASSWORD }}
        run: bash .github/scripts/native.sh store-credentials
      - name: build macOS plugin (universal)
        run: bash .github/scripts/native.sh build
      - name: verify universal binary
        run: bash .github/scripts/native.sh verify
      - name: merge Windows binaries into the bundle
        run: python3 .github/scripts/native.py merge-windows
      - name: codesign
        run: bash .github/scripts/native.sh sign
      - name: package, notarize & staple
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: bash .github/scripts/native.sh package
      - name: Revalidate retained outputs and publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: python3 .github/scripts/release.py publish --sha "$GITHUB_SHA" "${PRODUCT_NAME}-${VERSION}.zip" "${PRODUCT_NAME}-${VERSION}.dmg"
